      FOODMATE_KNOWLEDGE_MINIO_BUCKET: ${MINIO_BUCKET:-foodmate-private}
      # Only set these when the host network requires an explicit outbound proxy.
      # Keep Compose service names outside the proxy so local traffic stays local.
      HTTP_PROXY: ${FOODMATE_DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${FOODMATE_DOCKER_HTTPS_PROXY:-}
      NO_PROXY: ${FOODMATE_DOCKER_NO_PROXY:-localhost,127.0.0.1,foodmate,redis,postgres,milvus,minio,rocketmq-proxy}
