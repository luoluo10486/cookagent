      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/foodmate/internal/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodmate]

