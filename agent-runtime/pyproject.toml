[project]
name = "foodmate-agent-runtime"
version = "0.1.0"
description = "FoodMate Python Agent Runtime V1"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.0",
    "redis==6.4.0",
    "rocketmq-python-client==5.1.1",
    "langgraph==1.2.11",
    "minio==7.2.18",
    "pymilvus==2.5.5",
    "pypdf==6.16.1",
]

[tool.setuptools]
py-modules = ["runtime_server", "runtime_env", "mq_runtime", "agent_core", "model_provider", "paid_execution", "proposal_protocol", "sql_planner", "knowledge_rag", "knowledge_worker", "nutrition_catalog_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly configured external services or credentials",
]
